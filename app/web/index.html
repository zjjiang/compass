<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>compass · OKR 看板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6e7781;
    --line: #e4e4e0;
    --accent: #2563eb;
    --ok: #16a34a;
    --warn: #d97706;
    --bar: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1f232b;
      --ink: #e8eaed;
      --muted: #9aa0a6;
      --line: #2e333d;
      --accent: #60a5fa;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bar: #2b3a55;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { color: var(--muted); font-weight: normal; margin-left: 8px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .meta { color: var(--muted); font-size: 12px; }
  .overall { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; }
  .overall b { font-size: 26px; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .objective { padding: 10px 0; border-top: 1px solid var(--line); }
  .objective:first-of-type { border-top: 0; padding-top: 0; }
  .o-title { font-weight: 600; }
  .o-progress { float: right; color: var(--muted); font-size: 12px; }
  .kr { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; margin-top: 6px; }
  .kr .bar { width: 100%; }
  .kr .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  button {
    font: inherit; font-size: 12px;
    border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--ink);
    padding: 3px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: #dc2626; color: #dc2626; }
  .tag {
    font-size: 11px; border-radius: 4px; padding: 1px 6px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.active { color: var(--ok); border-color: var(--ok); }
  .tag.archived { color: var(--muted); }
  .reason { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  .flash { color: var(--warn); font-size: 12px; min-height: 16px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>compass <small>个人 OKR · 数据不出墙</small></h1>

  <section class="card">
    <h2>活跃版本 <span id="active-version" class="meta"></span></h2>
    <div class="overall"><b id="overall">0%</b><span class="meta" id="counts"></span></div>
    <div class="bar"><i id="overall-bar" style="width:0%"></i></div>
    <div id="objectives"></div>
  </section>

  <section class="card">
    <h2>门禁 · 待批提议</h2>
    <div id="proposals"></div>
    <div class="flash" id="gate-flash"></div>
  </section>

  <section class="card">
    <h2>版本快照（点击激活 = 回滚）</h2>
    <div id="versions"></div>
    <div class="flash" id="version-flash"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const detail = await res.json().then((b) => b.detail).catch(() => res.statusText);
    throw new Error(detail);
  }
  return res.json();
}

function renderActive(state) {
  $("active-version").textContent = `#${state.id} · ${state.label}`;
  const s = state.summary;
  $("overall").textContent = `${s.overall_progress}%`;
  $("counts").textContent = `${s.objective_count} 个目标 · ${s.kr_count} 个关键结果`;
  $("overall-bar").style.width = `${s.overall_progress}%`;
  $("objectives").innerHTML = state.doc.objectives.map((o) => {
    const krs = o.key_results.map((kr) => `
      <div class="kr">
        <span>${esc(kr.title)}${kr.note ? `<span class="note">${esc(kr.note)}</span>` : ""}</span>
        <span style="display:grid;grid-template-columns:1fr 42px;gap:8px;align-items:center">
          <span class="bar"><i style="width:${kr.progress}%"></i></span>
          <span class="pct">${kr.progress}%</span>
        </span>
      </div>`).join("");
    const avg = o.key_results.length
      ? Math.round(o.key_results.reduce((t, kr) => t + kr.progress, 0) / o.key_results.length)
      : 0;
    return `<div class="objective">
      <span class="o-progress">均 ${avg}%</span>
      <span class="o-title">${esc(o.title)}</span>${o.note ? `<span class="note">${esc(o.note)}</span>` : ""}
      ${krs || '<div class="empty">还没有关键结果</div>'}
    </div>`;
  }).join("") || '<div class="empty">空空如也 —— 对龙虾说句话，提议一个目标吧</div>';
}

function renderProposals(list) {
  $("proposals").innerHTML = list.length ? list.map((p) => `
    <div class="row">
      <span class="tag">提议</span>
      <span class="grow">
        <b>${esc(p.action)}</b> <code>${esc(JSON.stringify(p.args))}</code>
        <div class="reason">${esc(p.reason)} —— ${esc(p.by)} · ${esc(p.created_at)}</div>
      </span>
      <button class="primary" onclick="decide(${p.id}, 'approve')">批准</button>
      <button class="danger" onclick="decide(${p.id}, 'reject')">驳回</button>
    </div>`).join("") : '<div class="empty">没有待批提议</div>';
}

function renderVersions(list, activeId) {
  $("versions").innerHTML = list.map((v) => `
    <div class="row">
      <span class="tag ${v.status}">${v.status === "active" ? "活跃" : "归档"}</span>
      <span class="grow"><b>${esc(v.label)}</b>
        <span class="meta">#${v.id} · ${esc(v.created_at)}${v.parent_id ? ` · 基于 #${v.parent_id}` : ""}</span>
      </span>
      ${v.status === "active"
        ? '<span class="meta">当前</span>'
        : `<button onclick="activate(${v.id})">切到此版本</button>`}
    </div>`).join("");
}

async function decide(id, action) {
  try {
    await api(`/api/proposals/${id}/${action}`, { method: "POST" });
    $("gate-flash").textContent = "";
  } catch (e) { $("gate-flash").textContent = `失败：${e.message}`; }
  load();
}

async function activate(id) {
  try {
    await api(`/api/versions/${id}/activate`, { method: "POST" });
    $("version-flash").textContent = "";
  } catch (e) { $("version-flash").textContent = `失败：${e.message}`; }
  load();
}

async function load() {
  try {
    const [active, versions, proposals] = await Promise.all([
      api("/api/active"), api("/api/versions"), api("/api/proposals?status=pending"),
    ]);
    renderActive(active);
    renderVersions(versions, active.id);
    renderProposals(proposals);
  } catch (e) {
    $("gate-flash").textContent = `加载失败：${e.message}`;
  }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
